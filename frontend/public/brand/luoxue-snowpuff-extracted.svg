<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">落雪云端终端标志</title>
  <desc id="desc">从参考图重建的透明矢量雪团，带有冰蓝高光、淡紫阴影和黑色终端提示符。</desc>
  <defs>
    <path
      id="puff"
      d="M256 91C230 65 189 67 164 96C147 116 143 143 148 169C113 167 81 188 65 218C49 250 56 286 83 311C61 335 59 372 78 400C96 427 126 439 157 431C166 459 191 477 220 477C235 477 247 471 256 460C265 471 277 477 292 477C321 477 346 459 355 431C386 439 416 427 434 400C453 372 451 335 429 311C456 286 463 250 447 218C431 188 399 167 364 169C369 143 365 116 348 96C323 67 282 65 256 91Z"
    />

    <clipPath id="puffClip">
      <use href="#puff" />
    </clipPath>

    <linearGradient id="bodyGradient" x1="142" y1="78" x2="366" y2="466" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e6ffff" />
      <stop offset="0.22" stop-color="#bdfcff" />
      <stop offset="0.46" stop-color="#8ee8ff" />
      <stop offset="0.64" stop-color="#8dafff" />
      <stop offset="0.82" stop-color="#b6a9ff" />
      <stop offset="1" stop-color="#eef1ff" />
    </linearGradient>

    <radialGradient id="topGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(252 129) rotate(90) scale(188 230)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.94" />
      <stop offset="0.33" stop-color="#d9ffff" stop-opacity="0.72" />
      <stop offset="0.76" stop-color="#91efff" stop-opacity="0.18" />
      <stop offset="1" stop-color="#91efff" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="faceShade" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 304) rotate(90) scale(165 210)">
      <stop offset="0" stop-color="#7187ef" stop-opacity="0.45" />
      <stop offset="0.62" stop-color="#7e91f4" stop-opacity="0.18" />
      <stop offset="1" stop-color="#7e91f4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="bottomGlow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 414) rotate(90) scale(104 174)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="0.48" stop-color="#e5f8ff" stop-opacity="0.72" />
      <stop offset="1" stop-color="#d7e9ff" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="edgeGradient" x1="96" y1="106" x2="420" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dfffff" />
      <stop offset="0.42" stop-color="#7feaff" />
      <stop offset="0.72" stop-color="#e5f7ff" />
      <stop offset="1" stop-color="#b9a5ff" />
    </linearGradient>

    <filter id="outerGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="14" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <filter id="softVolume" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="12" />
    </filter>

  </defs>

  <use href="#puff" fill="#6654ef" opacity="0.42" filter="url(#outerGlow)" />
  <use href="#puff" fill="url(#bodyGradient)" />

  <g clip-path="url(#puffClip)">
    <rect x="38" y="54" width="436" height="438" fill="url(#topGlow)" />
    <ellipse cx="256" cy="310" rx="220" ry="176" fill="url(#faceShade)" />
    <ellipse cx="256" cy="420" rx="184" ry="112" fill="url(#bottomGlow)" />

    <ellipse cx="106" cy="284" rx="60" ry="132" fill="#5de6ff" opacity="0.48" filter="url(#softVolume)" />
    <ellipse cx="406" cy="284" rx="60" ry="132" fill="#65e5ff" opacity="0.45" filter="url(#softVolume)" />
    <ellipse cx="105" cy="376" rx="68" ry="92" fill="#d7adff" opacity="0.36" filter="url(#softVolume)" />
    <ellipse cx="407" cy="376" rx="68" ry="92" fill="#d5a9ff" opacity="0.36" filter="url(#softVolume)" />

    <use href="#puff" fill="none" stroke="#74e9ff" stroke-width="28" stroke-opacity="0.42" filter="url(#softGlow)" />
    <use href="#puff" fill="none" stroke="url(#edgeGradient)" stroke-width="15" stroke-opacity="0.82" />
  </g>

  <use href="#puff" fill="none" stroke="#f1ffff" stroke-width="4" stroke-opacity="0.78" />

  <g
    fill="none"
    stroke="#17131f"
    stroke-linecap="round"
    stroke-linejoin="round"
    stroke-width="36"
  >
    <path d="M160 220L202 272L160 324" />
    <path d="M282 324H360" />
  </g>
</svg>
