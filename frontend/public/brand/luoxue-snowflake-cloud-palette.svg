<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">落雪三色六角雪花标志</title>
  <desc id="desc">透明背景上的圆润六臂雪花，使用深海军蓝外层、加宽雪白中层和由留白包围的亮蓝圆点核心。</desc>
  <defs>
    <path id="standardArm" d="M256 238V80 M256 136L220 102 M256 136L292 102"/>
    <g id="sixArms">
      <use href="#standardArm"/>
      <use href="#standardArm" transform="rotate(60 256 238)"/>
      <use href="#standardArm" transform="rotate(120 256 238)"/>
      <use href="#standardArm" transform="rotate(180 256 238)"/>
      <use href="#standardArm" transform="rotate(240 256 238)"/>
      <use href="#standardArm" transform="rotate(300 256 238)"/>
    </g>
    <path id="blueStandardArm" d="M256 196V80 M256 136L220 102 M256 136L292 102"/>
    <g id="blueSixArms">
      <use href="#blueStandardArm"/>
      <use href="#blueStandardArm" transform="rotate(60 256 238)"/>
      <use href="#blueStandardArm" transform="rotate(120 256 238)"/>
      <use href="#blueStandardArm" transform="rotate(180 256 238)"/>
      <use href="#blueStandardArm" transform="rotate(240 256 238)"/>
      <use href="#blueStandardArm" transform="rotate(300 256 238)"/>
    </g>
  </defs>

  <!-- The full mark is reduced by 10% and centered to create more surrounding breathing room. -->
  <g transform="translate(256 256) scale(0.9) translate(-256 -238)">
    <!-- A wider white layer increases visual breathing room between navy and blue. -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <use href="#sixArms" stroke="#0e2e59" stroke-width="70"/>
      <use href="#sixArms" stroke="#fbfbfb" stroke-width="49"/>
    </g>

    <circle cx="256" cy="238" r="36" fill="#fbfbfb"/>
    <!-- Shortened blue spokes end independently with round caps before reaching the core. -->
    <use href="#blueSixArms" fill="none" stroke="#0b8bed" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="256" cy="238" r="18" fill="#0b8bed"/>
  </g>
</svg>
