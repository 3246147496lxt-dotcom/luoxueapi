name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing SemVer tag to release (for example v1.2.3)'
        required: true
        type: string
      simple_release:
        description: 'Only publish the x86_64 GHCR image'
        required: false
        type: boolean
        default: false

env:
  SIMPLE_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.simple_release) || (github.event_name != 'workflow_dispatch' && vars.SIMPLE_RELEASE == 'true') }}

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      commit: ${{ steps.resolve.outputs.commit }}
      simple_release: ${{ steps.resolve.outputs.simple_release }}
    steps:
      - name: Checkout repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Resolve and validate release tag
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          PUSH_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SIMPLE_RELEASE_REQUESTED: ${{ (github.event_name == 'workflow_dispatch' && inputs.simple_release) || (github.event_name != 'workflow_dispatch' && vars.SIMPLE_RELEASE == 'true') }}
        run: |
          set -Eeuo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$PUSH_TAG"
          fi

          export RELEASE_TAG_CANDIDATE="$tag"
          python3 tools/release_semver.py

          if ! git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Release tag does not exist" >&2
            exit 1
          fi

          commit="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release tag did not resolve to a commit" >&2
            exit 1
          fi

          if ! git merge-base --is-ancestor "$commit" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "Release tag is not part of the default branch history" >&2
            exit 1
          fi

          {
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "${tag#v}"
            printf 'commit=%s\n' "$commit"
            if [[ "$SIMPLE_RELEASE_REQUESTED" == "true" ]]; then
              printf 'simple_release=true\n'
            else
              printf 'simple_release=false\n'
            fi
          } >> "$GITHUB_OUTPUT"

  quality-gates:
    needs: resolve-release
    uses: ./.github/workflows/backend-ci.yml
    with:
      checkout_ref: ${{ needs.resolve-release.outputs.commit }}
      quota_viewer_release_version: ${{ needs.resolve-release.outputs.simple_release != 'true' && needs.resolve-release.outputs.version || '' }}

  security-gates:
    needs: resolve-release
    uses: ./.github/workflows/security-scan.yml
    with:
      checkout_ref: ${{ needs.resolve-release.outputs.commit }}

  quota-viewer-windows-release:
    needs: [resolve-release, quality-gates, security-gates]
    if: ${{ needs.resolve-release.outputs.simple_release != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Verify immutable Windows signing checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $checkoutCommit = git rev-parse --verify 'HEAD^{commit}'
          if ($checkoutCommit -ne $env:RELEASE_COMMIT) {
            throw 'Windows signing checkout does not match the validated release commit.'
          }

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quota-viewer/pnpm-lock.yaml

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.96.0 --profile minimal
          rustup default 1.96.0

      - name: Verify Windows release toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([int](node -p "process.versions.node.split('.')[0]") -lt 24) { exit 1 }
          if ((pnpm --version) -ne '9.15.9') { exit 1 }
          if ((rustc --version).Split(' ')[1] -ne '1.96.0') { exit 1 }
          if ((rustc -vV) -notcontains 'host: x86_64-pc-windows-msvc') { exit 1 }

      - name: Stamp release version into Windows Tauri sources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./quota-viewer/scripts/prepare-windows-release.ps1 `
            -QuotaViewerDirectory 'quota-viewer' `
            -ReleaseVersion $env:RELEASE_VERSION

      - name: Install quota viewer release dependencies
        working-directory: quota-viewer
        run: pnpm install --frozen-lockfile

      - name: Download unsigned release-versioned Windows application
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: luoxue-quota-viewer-windows-x64-release-app-unsigned
          path: release-input/windows-app/

      - name: Build, sign and verify Windows x64 NSIS release
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./quota-viewer/scripts/sign-windows-release.ps1 `
            -QuotaViewerDirectory 'quota-viewer' `
            -UnsignedExecutablePath 'release-input/windows-app/luoxue-quota-viewer.exe' `
            -SignedOutputDirectory 'release-output/windows-signed' `
            -ReleaseVersion $env:RELEASE_VERSION

      - name: Upload verified signed Windows release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luoxue-quota-viewer-windows-x64-nsis-release-signed
          path: |
            release-output/windows-signed/*.exe
            release-output/windows-signed/*.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    needs: [resolve-release, quality-gates, security-gates, quota-viewer-windows-release]
    if: >-
      ${{
        always() &&
        needs.resolve-release.result == 'success' &&
        needs.quality-gates.result == 'success' &&
        needs.security-gates.result == 'success' &&
        (
          needs.resolve-release.outputs.simple_release == 'true' ||
          needs.quota-viewer-windows-release.result == 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      SIMPLE_RELEASE: ${{ needs.resolve-release.outputs.simple_release }}
      RELEASE_TAG: ${{ needs.resolve-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve-release.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve-release.outputs.commit }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve-release.outputs.commit }}
          persist-credentials: false

      - name: Verify immutable release checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          checkout_commit="$(git rev-parse --verify 'HEAD^{commit}')"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          if [[ "$checkout_commit" != "$RELEASE_COMMIT" || "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "Validated release tag or checkout changed after resolution" >&2
            exit 1
          fi

      - name: Download frontend artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/

      - name: Download documentation artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-docs-dist
          path: backend/internal/web/dist/tutorial-docs/

      - name: Download signed Windows release assets
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: luoxue-quota-viewer-windows-x64-nsis-release-signed
          path: release-assets/windows/

      - name: Verify signed Windows release asset checksum
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          installers=(release-assets/windows/*.exe)
          checksums=(release-assets/windows/*.sha256)
          if [[ "${#installers[@]}" -ne 1 || "${#checksums[@]}" -ne 1 ]]; then
            echo "Expected exactly one signed Windows installer and one checksum" >&2
            exit 1
          fi
          (
            cd release-assets/windows
            sha256sum --check "$(basename "${checksums[0]}")"
          )

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum

      - name: Verify release inputs and embedded resources
        working-directory: backend
        shell: bash
        run: |
          set -Eeuo pipefail
          go version | grep -q 'go1.26.5'
          test -f internal/web/dist/index.html
          test -f internal/web/dist/tutorial-docs/index.html
          test -s resources/model-pricing/model_prices_and_context_window.json
          go test -tags=embed ./internal/web

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to DockerHub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.SIMPLE_RELEASE != 'true' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read annotated tag message safely
        id: tag_message
        shell: bash
        env:
          TAG_NAME: ${{ needs.resolve-release.outputs.tag }}
        run: |
          set -Eeuo pipefail
          message="$(git tag -l --format='%(contents:body)' "$TAG_NAME")"
          delimiter="TAG_MESSAGE_$(openssl rand -hex 16)"
          while grep -Fqx "$delimiter" <<< "$message"; do
            delimiter="TAG_MESSAGE_$(openssl rand -hex 16)"
          done
          {
            printf 'message<<%s\n' "$delimiter"
            printf '%s\n' "$message"
            printf '%s\n' "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve lowercase registry owner
        id: registry
        shell: bash
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          printf 'owner=%s\n' "$owner" >> "$GITHUB_OUTPUT"

      - name: Run full GoReleaser
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: 'v2.17.0'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.registry.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'skip' }}

      - name: Run simple GoReleaser
        if: ${{ env.SIMPLE_RELEASE == 'true' }}
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: 'v2.17.0'
          args: release --clean --config=.goreleaser.simple.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          GITHUB_REPO_OWNER: ${{ github.repository_owner }}
          GITHUB_REPO_OWNER_LOWER: ${{ steps.registry.outputs.owner }}
          GITHUB_REPO_NAME: ${{ github.event.repository.name }}
          DOCKERHUB_USERNAME: skip

      - name: Attach signed Windows assets to GitHub Release
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          installers=(release-assets/windows/*.exe)
          checksums=(release-assets/windows/*.sha256)
          if [[ "${#installers[@]}" -ne 1 || "${#checksums[@]}" -ne 1 ]]; then
            echo "Signed Windows release assets are incomplete" >&2
            exit 1
          fi

          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" \
            "${installers[0]}" \
            "${checksums[0]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

          installer_name="$(basename "${installers[0]}")"
          checksum_name="$(basename "${checksums[0]}")"
          remote_assets="$(
            gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name'
          )"
          grep -Fx "$installer_name" <<< "$remote_assets"
          grep -Fx "$checksum_name" <<< "$remote_assets"

      - name: Verify GoReleaser binary metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t binary_paths < <(jq -r '
            .[]
            | select(
                .type == "Binary"
                and .name == "sub2api"
                and .goos == "linux"
                and .goarch == "amd64"
                and .extra.ID == "sub2api"
              )
            | .path
          ' dist/artifacts.json)
          if [[ "${#binary_paths[@]}" -ne 1 || ! -x "${binary_paths[0]:-}" ]]; then
            printf 'Expected exactly one executable linux/amd64 artifact, found: %s\n' \
              "${binary_paths[*]:-none}" >&2
            exit 1
          fi

          version_output="$("${binary_paths[0]}" --version 2>&1)"
          printf '%s\n' "$version_output"
          grep -Fq -- "LuoxueAPI ${RELEASE_VERSION} (commit: ${RELEASE_COMMIT}," \
            <<< "$version_output"

      - name: Verify published GHCR images
        shell: bash
        env:
          REGISTRY_OWNER: ${{ steps.registry.outputs.owner }}
        run: |
          set -Eeuo pipefail
          if [[ "$SIMPLE_RELEASE" == "true" ]]; then
            platforms=(linux/amd64)
          else
            # Leave amd64 as the locally selected tag for the published-image smoke.
            platforms=(linux/arm64 linux/amd64)
          fi

          for image_name in luoxueapi sub2api; do
            image_ref="ghcr.io/${REGISTRY_OWNER}/${image_name}:${RELEASE_VERSION}"
            for platform in "${platforms[@]}"; do
              for attempt in 1 2 3; do
                if docker pull --platform "$platform" "$image_ref"; then
                  break
                fi
                if [[ "$attempt" -eq 3 ]]; then
                  printf 'Unable to pull %s for %s after %s attempts\n' \
                    "$image_ref" "$platform" "$attempt" >&2
                  exit 1
                fi
                sleep "$((attempt * 5))"
              done

              version_output="$(docker run --rm --platform "$platform" "$image_ref" --version 2>&1)"
              printf '%s\n' "$version_output"
              grep -Fq -- "LuoxueAPI ${RELEASE_VERSION} (commit: ${RELEASE_COMMIT}," \
                <<< "$version_output"

              image_version="$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' \
                "$image_ref")"
              image_revision="$(docker image inspect \
                --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
                "$image_ref")"
              if [[ "$image_version" != "$RELEASE_VERSION" || "$image_revision" != "$RELEASE_COMMIT" ]]; then
                printf 'Image metadata mismatch for %s (%s): version=%s revision=%s\n' \
                  "$image_ref" "$platform" "$image_version" "$image_revision" >&2
                exit 1
              fi
            done
          done

      - name: Run published GHCR image smoke
        shell: bash
        env:
          REGISTRY_OWNER: ${{ steps.registry.outputs.owner }}
        run: |
          set -Eeuo pipefail
          for image_name in luoxueapi sub2api; do
            SMOKE_IMAGE="ghcr.io/${REGISTRY_OWNER}/${image_name}:${RELEASE_VERSION}" \
              bash backend/scripts/e2e-test.sh
          done

      - name: Update DockerHub description
        if: ${{ env.SIMPLE_RELEASE != 'true' && env.DOCKERHUB_USERNAME != '' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/luoxueapi
          short-description: 'LuoxueAPI - AI API Gateway Platform'
          readme-filepath: ./deploy/DOCKER.md

      - name: Send Telegram notification
        if: ${{ env.SIMPLE_RELEASE != 'true' }}
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAG_NAME: ${{ needs.resolve-release.outputs.tag }}
          VERSION: ${{ needs.resolve-release.outputs.version }}
          TAG_MESSAGE: ${{ steps.tag_message.outputs.message }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -Eeuo pipefail
          if [[ -z "$TELEGRAM_BOT_TOKEN" || -z "$TELEGRAM_CHAT_ID" ]]; then
            echo "Telegram credentials not configured; notification skipped"
            exit 0
          fi

          owner="${REPOSITORY%%/*}"
          owner="$(printf '%s' "$owner" | tr '[:upper:]' '[:lower:]')"
          ghcr_image="ghcr.io/${owner}/luoxueapi"
          release_notes="${TAG_MESSAGE:0:3500}"
          message="$(printf 'LuoxueAPI %s released\n\n%s\n\nDocker:\ndocker pull %s:%s\n\nhttps://github.com/%s/releases/tag/%s' \
            "$VERSION" "$release_notes" "$ghcr_image" "$VERSION" "$REPOSITORY" "$TAG_NAME")"
          payload="$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$message" \
            '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')"

          curl --fail --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H 'Content-Type: application/json' \
            --data-binary "$payload"

      - name: Checkout default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Sync VERSION file to released tag
        shell: bash
        run: |
          set -Eeuo pipefail
          current_version="$(tr -d '\r\n' < backend/cmd/server/VERSION || true)"
          if [[ "$current_version" == "$RELEASE_VERSION" ]]; then
            echo "VERSION file is already current"
            exit 0
          fi

          printf '%s\n' "$RELEASE_VERSION" > backend/cmd/server/VERSION
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/cmd/server/VERSION
          git commit -m "chore: sync VERSION to ${RELEASE_VERSION} [skip ci]"
          git push origin "HEAD:${DEFAULT_BRANCH}"
