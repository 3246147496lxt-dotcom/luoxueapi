name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      checkout_ref:
        description: Commit or tag to validate
        required: false
        type: string
        default: ''
      quota_viewer_release_version:
        description: SemVer to stamp into the Windows quota viewer release build
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  shell:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Check deployment scripts
        run: |
          /bin/bash -n deploy/apple-container.sh
          /bin/bash deploy/tests/apple-container-test.sh
          /bin/sh deploy/tests/docker-compose-security-test.sh
      - name: Check release workflow security contract
        run: |
          python3 tools/test_release_workflow.py
          python3 tools/test_pnpm_audit_exceptions.py
          python3 tools/test_delivery_runtime_contract.py
          python3 tools/test_candidate_delivery.py
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Validate Compose and .env contract
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/test_compose_contract.py
          for compose_file in \
            deploy/docker-compose.yml \
            deploy/docker-compose.local.yml \
            deploy/docker-compose.dev.yml \
            deploy/docker-compose.standalone.yml
          do
            docker compose --env-file deploy/.env.example -f "$compose_file" config --quiet --no-env-resolution
          done
          SMOKE_APP_CONTAINER_NAME=contract-smoke-app \
          SMOKE_POSTGRES_CONTAINER_NAME=contract-smoke-postgres \
          SMOKE_REDIS_CONTAINER_NAME=contract-smoke-redis \
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.smoke.yml \
            config --quiet --no-env-resolution
          release_smoke_config="$(
            SMOKE_IMAGE=ghcr.io/example/luoxueapi:contract \
            SMOKE_APP_CONTAINER_NAME=contract-release-smoke-app \
            SMOKE_POSTGRES_CONTAINER_NAME=contract-release-smoke-postgres \
            SMOKE_REDIS_CONTAINER_NAME=contract-release-smoke-redis \
            docker compose \
              --env-file deploy/.env.example \
              -f deploy/docker-compose.yml \
              -f deploy/docker-compose.smoke.yml \
              -f deploy/docker-compose.release-smoke.yml \
              config --format json --no-env-resolution
          )"
          jq -e '
            .services.sub2api.image == "ghcr.io/example/luoxueapi:contract"
            and .services.sub2api.build == null
            and .services.sub2api.platform == "linux/amd64"
            and .services.sub2api.pull_policy == "never"
            and .services.sub2api.ports == null
          ' <<< "$release_smoke_config" >/dev/null

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: false
      - name: Validate release packaging inputs and GoReleaser configs
        shell: bash
        env:
          GITHUB_REPO_OWNER: contract-owner
          GITHUB_REPO_OWNER_LOWER: contract-owner
          GITHUB_REPO_NAME: sub2api
          DOCKERHUB_USERNAME: contract-owner
          TAG_MESSAGE: contract
        run: |
          set -Eeuo pipefail
          test -s backend/resources/model-pricing/model_prices_and_context_window.json
          go run github.com/goreleaser/goreleaser/v2@v2.17.0 check --config .goreleaser.yaml
          go run github.com/goreleaser/goreleaser/v2@v2.17.0 check --config .goreleaser.simple.yaml

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Verify generated Wire dependency graph
        working-directory: backend
        run: make wire-check
      - name: Unit tests
        working-directory: backend
        run: go test -tags=unit -coverprofile=coverage-unit.out ./...
      - name: Integration tests
        working-directory: backend
        run: make test-integration
      - name: Race tests for lifecycle and module boundaries
        working-directory: backend
        run: go test -race ./internal/lifecycle ./internal/server ./internal/modules/...
      - name: Upload backend coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backend-unit-coverage
          path: backend/coverage-unit.out
          retention-days: 14
          if-no-files-found: error

  postgresql18-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Execute candidate SQL and 246-to-256 migration contract on PostgreSQL 18
        working-directory: backend
        env:
          CI: 'true'
        run: go test -tags=integration ./internal/repository -run '^TestCandidate' -count=1 -v

  deployment-script-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Verify preinstalled ShellCheck
        run: |
          command -v shellcheck
          shellcheck --version
      - name: Validate candidate delivery and cleanup contracts
        run: python3 tools/test_candidate_delivery.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Verify frontend runtime and package manager versions
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          test "$(pnpm --version)" = "9.15.9"
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Frontend lint, production/test typecheck and full Vitest
        run: make test-frontend
      - name: Upload frontend coverage baseline
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: error
      - name: Build frontend
        working-directory: frontend
        run: pnpm run build
      - name: Upload frontend bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
          retention-days: 1
          if-no-files-found: error

  quota-viewer:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quota-viewer/pnpm-lock.yaml
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - name: Verify quota viewer toolchain versions
        shell: bash
        run: |
          set -Eeuo pipefail
          node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
          test "$(pnpm --version)" = "9.15.9"
          test "$(rustc --version | awk '{print $2}')" = "1.96.0"
      - name: Install quota viewer dependencies
        working-directory: quota-viewer
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build quota viewer frontend
        working-directory: quota-viewer
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
          if grep -R -E '128\.64|1,906,000|Pro 月度会员' dist; then
            echo "Production quota viewer bundle contains demo quota data" >&2
            exit 1
          fi
      - name: Format, check, lint and test quota viewer Rust core
        working-directory: quota-viewer/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets

  quota-viewer-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QUOTA_VIEWER_RELEASE_VERSION: ${{ inputs.quota_viewer_release_version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: quota-viewer/pnpm-lock.yaml
      - name: Install Rust toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          rustup toolchain install 1.96.0 --profile minimal --component rustfmt,clippy
          rustup default 1.96.0
      - name: Verify quota viewer Windows toolchain versions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([int](node -p "process.versions.node.split('.')[0]") -lt 24) { exit 1 }
          if ((pnpm --version) -ne '9.15.9') { exit 1 }
          if ((rustc --version).Split(' ')[1] -ne '1.96.0') { exit 1 }
          if ((rustc -vV) -notcontains 'host: x86_64-pc-windows-msvc') { exit 1 }
      - name: Stamp release version into Windows Tauri sources
        if: ${{ env.QUOTA_VIEWER_RELEASE_VERSION != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./quota-viewer/scripts/prepare-windows-release.ps1 `
            -QuotaViewerDirectory 'quota-viewer' `
            -ReleaseVersion $env:QUOTA_VIEWER_RELEASE_VERSION
      - name: Install quota viewer dependencies
        working-directory: quota-viewer
        run: pnpm install --frozen-lockfile
      - name: Typecheck, test and build quota viewer frontend
        working-directory: quota-viewer
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - name: Format, check, lint and test quota viewer Rust core
        working-directory: quota-viewer/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo check --locked --all-targets
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
      - name: Build unsigned Windows x64 release NSIS installer
        working-directory: quota-viewer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path 'src-tauri/icons/icon.ico' -PathType Leaf)) {
            throw 'Missing required Windows icon: quota-viewer/src-tauri/icons/icon.ico'
          }
          pnpm run tauri:build:windows
      - name: Verify Windows Tauri release version metadata
        if: ${{ env.QUOTA_VIEWER_RELEASE_VERSION != '' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $appExecutable = 'quota-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/luoxue-quota-viewer.exe'
          $installers = @(
            Get-ChildItem `
              -LiteralPath 'quota-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis' `
              -Filter '*-setup.exe' `
              -File
          )
          if ($installers.Count -ne 1) {
            throw 'Expected exactly one release-versioned NSIS installer.'
          }
          ./quota-viewer/scripts/verify-windows-release-version.ps1 `
            -FilePath $appExecutable `
            -ReleaseVersion $env:QUOTA_VIEWER_RELEASE_VERSION
          ./quota-viewer/scripts/verify-windows-release-version.ps1 `
            -FilePath $installers[0].FullName `
            -ReleaseVersion $env:QUOTA_VIEWER_RELEASE_VERSION
      - name: Upload unsigned release-versioned Windows application
        if: ${{ env.QUOTA_VIEWER_RELEASE_VERSION != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luoxue-quota-viewer-windows-x64-release-app-unsigned
          path: quota-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/luoxue-quota-viewer.exe
          retention-days: 1
          if-no-files-found: error
      - name: Upload unsigned Windows x64 release NSIS installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: luoxue-quota-viewer-windows-x64-nsis-release-unsigned
          path: quota-viewer/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          retention-days: 7
          if-no-files-found: error

  docs-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs-site/package-lock.json
      - name: Verify documentation Node.js runtime
        run: node -e 'if (Number(process.versions.node.split(".")[0]) < 24) process.exit(1)'
      - name: Install documentation site dependencies
        working-directory: docs-site
        run: npm ci
      - name: Test and build documentation site
        working-directory: docs-site
        run: |
          npm test
          npm run build
          npm run verify:build
      - name: Upload documentation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-docs-dist
          path: docs-site/dist/
          retention-days: 1
          if-no-files-found: error

  embedded-web:
    needs: [frontend, docs-site]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Download frontend bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-frontend-dist
          path: backend/internal/web/dist/
      - name: Download documentation bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ci-docs-dist
          path: backend/internal/web/dist/tutorial-docs/
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: Verify embedded main and documentation sites
        working-directory: backend
        run: go test -tags=embed ./internal/web ./cmd/server

  compose-smoke:
    needs: [frontend, docs-site]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - name: Run isolated Compose smoke
        working-directory: backend
        run: make test-e2e

  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.26.6'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.9
          args: --timeout=30m
          working-directory: backend

  candidate-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/quota-viewer-macos-dmg'
    needs:
      - shell
      - compose-contract
      - release-contract
      - test
      - postgresql18-integration
      - deployment-script-regression
      - frontend
      - quota-viewer
      - quota-viewer-windows
      - docs-site
      - embedded-web
      - compose-smoke
      - golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      commit: ${{ steps.build.outputs.commit }}
      version: ${{ steps.build.outputs.version }}
      immutable_image: ${{ steps.build.outputs.immutable_image }}
      image_digest: ${{ steps.build.outputs.image_digest }}
      migration_count: ${{ steps.build.outputs.migration_count }}
      migration_set_sha256: ${{ steps.build.outputs.migration_set_sha256 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build, push and verify clean linux/amd64 candidate image
        id: build
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_VERSION: 2.0.0-rc.5
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: |
          set -Eeuo pipefail
          # REGISTRY_OWNER is provided by the step environment.
          # shellcheck disable=SC2153
          registry_owner="$(printf '%s' "$REGISTRY_OWNER" | tr '[:upper:]' '[:lower:]')"
          export CANDIDATE_IMAGE_REPOSITORY="ghcr.io/${registry_owner}/luoxueapi"
          export CANDIDATE_OUTPUT_FILE="$GITHUB_OUTPUT"
          ./tools/build_candidate_image.sh
      - name: Write candidate build evidence
        shell: bash
        env:
          CANDIDATE_COMMIT: ${{ steps.build.outputs.commit }}
          CANDIDATE_VERSION: ${{ steps.build.outputs.version }}
          CANDIDATE_IMAGE_REF: ${{ steps.build.outputs.image_ref }}
          CANDIDATE_IMAGE_DIGEST: ${{ steps.build.outputs.image_digest }}
          CANDIDATE_IMMUTABLE_IMAGE: ${{ steps.build.outputs.immutable_image }}
          MIGRATION_COUNT: ${{ steps.build.outputs.migration_count }}
          MIGRATION_SET_SHA256: ${{ steps.build.outputs.migration_set_sha256 }}
          CLEAN_ARCHIVE_SHA256: ${{ steps.build.outputs.clean_archive_sha256 }}
        run: |
          set -Eeuo pipefail
          python3 tools/migration_manifest.py > candidate-migration-manifest.json
          {
            printf 'commit=%s\n' "$CANDIDATE_COMMIT"
            printf 'version=%s\n' "$CANDIDATE_VERSION"
            printf 'image_ref=%s\n' "$CANDIDATE_IMAGE_REF"
            printf 'image_digest=%s\n' "$CANDIDATE_IMAGE_DIGEST"
            printf 'immutable_image=%s\n' "$CANDIDATE_IMMUTABLE_IMAGE"
            printf 'migration_count=%s\n' "$MIGRATION_COUNT"
            printf 'migration_set_sha256=%s\n' "$MIGRATION_SET_SHA256"
            printf 'clean_archive_sha256=%s\n' "$CLEAN_ARCHIVE_SHA256"
            printf 'clean_archive_forbidden_entries=0\n'
          } | tee candidate-build-evidence.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload candidate build evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-image-evidence-${{ github.sha }}
          path: |
            candidate-build-evidence.txt
            candidate-migration-manifest.json
          retention-days: 14
          if-no-files-found: error

  candidate-image-validation:
    needs: candidate-image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull published immutable linux/amd64 image
        env:
          CANDIDATE_IMAGE: ${{ needs.candidate-image.outputs.immutable_image }}
        run: docker pull --platform linux/amd64 "$CANDIDATE_IMAGE"
      - name: Run published immutable image smoke
        shell: bash
        env:
          SMOKE_IMAGE: ${{ needs.candidate-image.outputs.immutable_image }}
        run: bash backend/scripts/e2e-test.sh
      - name: Verify old application startup on candidate forward schema
        shell: bash
        env:
          CANDIDATE_IMAGE: ${{ needs.candidate-image.outputs.immutable_image }}
          CANDIDATE_COMMIT: ${{ needs.candidate-image.outputs.commit }}
          CANDIDATE_VERSION: ${{ needs.candidate-image.outputs.version }}
        run: bash deploy/tests/candidate-forward-schema-test.sh
