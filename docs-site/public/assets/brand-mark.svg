<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">落雪六角雪花标志</title>
  <desc id="desc">雾霾冰蓝圆角方形背景上的六臂冰晶雪花，下方晶臂略长并收尖，呈现落雪动势。</desc>
  <defs>
    <linearGradient id="background" x1="54" y1="42" x2="458" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#dff7f8"/>
      <stop offset="0.48" stop-color="#acd7df"/>
      <stop offset="1" stop-color="#70abb8"/>
    </linearGradient>
    <linearGradient id="iceShell" x1="126" y1="86" x2="390" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d9fbff"/>
      <stop offset="0.5" stop-color="#63d6e3"/>
      <stop offset="1" stop-color="#1aa0b4"/>
    </linearGradient>
    <linearGradient id="snowCore" x1="170" y1="92" x2="330" y2="396" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.54" stop-color="#eaffff"/>
      <stop offset="1" stop-color="#b9f2f2"/>
    </linearGradient>
    <linearGradient id="crystalCore" x1="226" y1="202" x2="286" y2="276" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c8f4f3"/>
    </linearGradient>

    <!-- Five standard arms are 158 units long. The separate bottom arm is 182 units (15.2% longer). -->
    <path id="standardArm" d="M256 238V80 M256 136L220 102 M256 136L292 102"/>
    <g id="fiveArms">
      <use href="#standardArm"/>
      <use href="#standardArm" transform="rotate(60 256 238)"/>
      <use href="#standardArm" transform="rotate(120 256 238)"/>
      <use href="#standardArm" transform="rotate(240 256 238)"/>
      <use href="#standardArm" transform="rotate(300 256 238)"/>
    </g>
    <path id="bottomFramework" d="M256 238V336 M256 340L218 376 M256 340L294 376"/>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#background)"/>
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="#efffff" stroke-opacity="0.42" stroke-width="8"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#fiveArms" stroke="#0b7180" stroke-width="60"/>
    <use href="#bottomFramework" stroke="#0b7180" stroke-width="60"/>
    <use href="#fiveArms" stroke="url(#iceShell)" stroke-width="48"/>
    <use href="#bottomFramework" stroke="url(#iceShell)" stroke-width="48"/>
    <use href="#fiveArms" stroke="url(#snowCore)" stroke-width="25"/>
    <use href="#bottomFramework" stroke="url(#snowCore)" stroke-width="25"/>
  </g>

  <!-- Tapered terminal keeps the bottom arm part of the snowflake while giving it a falling direction. -->
  <path d="M226 302C227 345 238 386 256 420C274 386 285 345 286 302Z" fill="#0b7180"/>
  <path d="M233 304C234 344 243 379 256 410C269 379 278 344 279 304Z" fill="url(#iceShell)"/>
  <path d="M246 306C247 338 251 370 256 393C261 370 265 338 266 306Z" fill="url(#snowCore)"/>

  <polygon points="256,181 306,210 306,266 256,295 206,266 206,210" fill="#0b7180"/>
  <polygon points="256,191 297,215 297,261 256,285 215,261 215,215" fill="url(#iceShell)"/>
  <polygon points="256,202 287,220 287,256 256,274 225,256 225,220" fill="url(#crystalCore)"/>
</svg>
